name: Bug report
description: Report a reproducible problem without private data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include credentials, property identifiers, queries, URLs, metrics, exports, or snapshots. Use a private security advisory for vulnerabilities.
  - type: dropdown
    id: skill
    attributes:
      label: Skill
      options:
        - google-search-console
        - bing-webmaster-tools
        - yandex-webmaster
        - plugin or installation
        - repository tooling
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: 22.x
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Use synthetic identifiers and redact all private values.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the command shape and sanitized output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
